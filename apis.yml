aid: pilotly
name: Pilotly
description: Pilotly is a media and content audience-testing research platform used by studios,
  streamers, and brands to test films, trailers, series, and advertising with targeted audiences
  before release. Its managed service pairs clients with expert research managers who handle survey
  design, audience targeting, and insights synthesis, while a Study Tracker guides each project through
  five stages (Requested, Setting up, Fielding, Analysis, Complete). Content is fielded through a secure,
  DRM-protected and watermarked video player across desktop, mobile, and smart TV. Pilotly is a
  managed-service SaaS with no public developer API surface; clients named on the site include Netflix,
  Amazon, Sony, Paramount, Warner Bros. Discovery, and Audible. Surfaced as a portfolio company of
  500 Global and profiled in the API Evangelist network.
